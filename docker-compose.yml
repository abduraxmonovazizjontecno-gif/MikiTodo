services:
  mikitodo:
    build: .
    image: mikitodo:latest
    container_name: mikitodo_con
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - NUM_PROXIES=1
      - USE_POSTGRES=true
      - DB_HOST=mikitodo_db
      - DB_PORT=5432
      - DB_NAME=mikitodo_db
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - TRUST_PROXY=true
    depends_on:
      mikitodo_db:
        condition: service_healthy
    networks:
      - mikitodo_net

  mikitodo_db:
    image: postgres:15-alpine
    container_name: mikitodo_db_con
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mikitodo_db
    # Port only bound to localhost for security
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mikitodo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mikitodo_data:/var/lib/postgresql/data
    networks:
      - mikitodo_net

volumes:
  mikitodo_data:
  media_data:

networks:
  mikitodo_net:
    driver: bridge
